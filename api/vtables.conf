# The function tables mesh-api-gen describes (--vtable-conf): crates/xip-abi/src/schema_data.rs and vt_shims.rs. What does not fit a parcel is
# written as `/// note=...` in the doc comment of the table function itself (crates/xip-abi/src).
# component NAME TABLE-STRUCT VERSION-CONST|- MODE
#   shims: the host provides it and a wasm32 module gets forwarding stubs; host: the host provides it; hosted: a module provides it
component wifi         Wifi      WIFI_VERSION        shims
component wifi-tuning  WifiTuner WIFI_TUNING_VERSION shims
component link         Link      LINK_VERSION        shims
component power        Power     POWER_VERSION       shims
component nimble       Nimble    NIMBLE_VERSION      shims
component stream       Stream    STREAM_VERSION      shims
component quic         Quic      QUIC_VERSION        shims
component crypto       Crypto    CRYPTO_VERSION      shims
component identity     Identity  IDENTITY_VERSION    shims
component hw           Hardware  HARDWARE_VERSION    host
# tables a module hosts: described for the runtime's thunks (hosted.rs), no stubs
component ble          Ble       -                   hosted
component lora         Lora      -                   hosted
component nan          Nan       -                   hosted
component system       System    -                   hosted

