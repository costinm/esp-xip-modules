[package]
name = "esp-mod-rtest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The device test of the esp-xip-modules ABI in Rust: the device test module (the `test` slot)"
publish = false

# Standalone: built by tools/mkmod.py --cargo (scripts/build.sh), not as part of a cargo workspace.
[workspace]

[dependencies]
xip-abi = { path = "../../crates/xip-abi", features = ["allocator-api"] }
mesh-api = { git = "https://github.com/costinm/ssh-mesh", default-features = false }
quic-tools = { git = "https://github.com/costinm/ssh-mesh", default-features = false }

[dev-dependencies]
quic-tools = { git = "https://github.com/costinm/ssh-mesh", default-features = false, features = ["tokio"] }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt"] }

[patch."https://github.com/costinm/ssh-mesh"]
mesh-api = { path = "../../../rust/ssh-mesh/crates/mesh-api" }
quic-base = { path = "../../../rust/ssh-mesh/crates/quic-base" }
quic-mux = { path = "../../../rust/ssh-mesh/crates/quic-mux" }
quic-tools = { path = "../../../rust/ssh-mesh/crates/quic-tools" }

[package.metadata]
# Options for tools/mkmod.py (scripts/build.sh). 
mkmod = "--stack 4096 --state 512 --port 3 --stream 3 --wire 8"

[features]
flat-image = ["xip-abi/global-alloc"]
# the panic handler and the global allocator of a no_std library built as wasm for crates/xip-runtime-host (scripts/build-host-modules.sh)
sim = ["xip-abi/global-alloc"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "mod_rtest"
required-features = ["flat-image"]

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
