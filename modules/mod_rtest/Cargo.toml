[package]
name = "esp-mod-rtest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The device test of the esp-xip-modules ABI in Rust: the device test module (the `test` slot)"
publish = false

# Standalone: built by tools/mkmod.py --cargo (scripts/build.sh), not as part of a cargo workspace.
[workspace]

[dependencies]
xip-abi = { path = "../../crates/xip-abi", features = ["allocator-api"] }
dmesh-server = { git = "https://github.com/costinm/dmesh", rev = "ab109bf1836bbe1be117b859f60ac90ec3cb9010", default-features = false }
quic-lite = { git = "https://github.com/costinm/dmesh", rev = "ab109bf1836bbe1be117b859f60ac90ec3cb9010", default-features = false }

[package.metadata]
# Options for tools/mkmod.py (scripts/build.sh). 
mkmod = "--stack 4096 --state 512 --port 3 --stream 3"

[features]
flat-image = ["xip-abi/global-alloc"]
# the panic handler of a no_std library built as a shared object for crates/xip-runtime-host (scripts/build-host-modules.sh)
sim = ["xip-abi/global-alloc"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "mod_rtest"
required-features = ["flat-image"]

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
