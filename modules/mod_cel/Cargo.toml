[package]
name = "mod-cel"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
[workspace]
[dependencies]
xip-abi = { path = "../../crates/xip-abi" }
ucel = { path = "../../crates/uCEL" }
[package.metadata]
mkmod = "--name cel --tag 53 --stack 8192 --state 0 --wire 53:1"
[features]
flat-image = ["xip-abi/global-alloc"]
[lib]
crate-type = ["rlib"]
[[bin]]
name = "mod_cel"
required-features = ["flat-image"]
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
