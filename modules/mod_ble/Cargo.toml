[package]
name = "esp-mod-ble"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "BLE methods and boot policy for the C runtime's xip_ble component"
publish = false

# Standalone: built by tools/mkmod.py --cargo (scripts/build.sh), not as part of a cargo workspace.
[workspace]

[dependencies]
xip-abi = { path = "../../crates/xip-abi", features = ["global-alloc"] }

[package.metadata]
# Options for tools/mkmod.py (scripts/build.sh). No port: requests arrive as 0x444d0002 datagrams (PPP port 0xf7), and other modules use the `ble` table.
mkmod = "--stack 4096 --state 128 --autostart --components ble"

[features]
flat-image = []
# the panic handler and the global allocator of a no_std library built as wasm for crates/xip-runtime-host (scripts/build-host-modules.sh)
sim = []

[lib]
crate-type = ["rlib"]

[[bin]]
name = "mod_ble"
required-features = ["flat-image"]

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
