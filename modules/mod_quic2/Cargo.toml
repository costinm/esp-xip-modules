[package]
name = "esp-mod-quic2"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Combined quic-link + quic-mux multi-link stream endpoint over UDP, PPP serial, and TCP"
publish = false

[workspace]

[dependencies]
xip-abi = { path = "../../crates/xip-abi" }
quic-link = { git = "https://github.com/costinm/ssh-mesh", default-features = false }
quic-mux = { git = "https://github.com/costinm/ssh-mesh", default-features = false }

[package.metadata]
mkmod = "--name quic2 --tag 55 --stack 8192 --state 8 --port 243 --stream 6"

[features]
flat-image = ["xip-abi/global-alloc"]
sim = ["xip-abi/global-alloc"]

[[bin]]
name = "mod_quic2"
required-features = ["flat-image"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
debug = false
strip = "none"

[dev-dependencies]
quic-base = { git = "https://github.com/costinm/ssh-mesh", default-features = false, features = ["host-pools"] }
xip-psa = { path = "../../crates/xip-psa" }

[patch."https://github.com/costinm/ssh-mesh"]
mesh-api = { path = "../../../rust/ssh-mesh/crates/mesh-api" }
quic-base = { path = "../../../rust/ssh-mesh/crates/quic-base" }
quic-link = { path = "../../../rust/ssh-mesh/crates/quic-link" }
quic-mux = { path = "../../../rust/ssh-mesh/crates/quic-mux" }
