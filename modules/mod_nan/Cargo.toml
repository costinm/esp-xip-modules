[package]
name = "esp-mod-nan"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "NAN and NAN-over-NOW synchronization and service discovery"
publish = false

# Standalone: built by tools/mkmod.py --cargo (scripts/build.sh), not as part of a cargo workspace.
[workspace]

[dependencies]
xip-abi = { path = "../../crates/xip-abi" }
dmesh-server = { optional = true, git = "https://github.com/costinm/dmesh", rev = "0b3e629444b072d65799baab73a8868c476498b0", default-features = false }
dmesh-rawnan = { optional = true, git = "https://github.com/costinm/dmesh", rev = "0b3e629444b072d65799baab73a8868c476498b0", default-features = false }

[dev-dependencies]
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa"] }

[package.metadata]
# Options for tools/mkmod.py (scripts/build.sh). Virtual NAN port 0xf6.
mkmod = "--name nan --tag 46 --stack 12288 --state 128 --port 246 --autostart --components nan --envelopes 1"

[features]
default = ["runtime"]
runtime = ["dep:dmesh-server", "dep:dmesh-rawnan"]
# Select with default-features = false; excludes implementation and radio dependencies.
api-only = []
flat-image = ["runtime", "xip-abi/global-alloc"]

[lib]
crate-type = ["rlib"]

[[bin]]
name = "mod_nan"
required-features = ["flat-image"]

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "s"
panic = "abort"
# Symbols stay in the ELF for size audits; mkmod packages only loadable bytes.
strip = "none"

[patch."https://github.com/costinm/dmesh"]
dmesh-server = { path = "../../../dmesh/crates/dmesh-server" }
dmesh-rawnan = { path = "../../../dmesh/crates/rawnan" }
