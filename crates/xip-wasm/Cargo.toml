[package]
name = "xip-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Loads modules compiled to WebAssembly (modules/mod_wasm3/WASM.md) for the xip host runtime"
publish = false

[dependencies]
wasmi = { version = "2.0", default-features = false, features = ["std", "validate", "portable-dispatch"] }
xip-abi = { path = "../xip-abi" }
libc = "0.2"

[dev-dependencies]
wat = "1"
