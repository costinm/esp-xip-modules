[package]
name = "xip-runtime-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The xip runtime for a development host (Linux): loads modules as shared objects, runs them with the same event model as the device runtimes, virtual time and pluggable fixtures"
publish = false


[dependencies]
xip-abi = { path = "../xip-abi" }
xip-wasm = { path = "../xip-wasm" }
xip-psa = { path = "../xip-psa" }
quic-relay = { git = "https://github.com/costinm/ssh-mesh" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "net", "io-util", "sync", "signal"] }

[[bin]]
name = "xip-host"
path = "src/main.rs"

[dev-dependencies]
dmesh-cli = { path = "../dmesh-cli" }
quic-base = { git = "https://github.com/costinm/ssh-mesh" }
quic-link = { git = "https://github.com/costinm/ssh-mesh" }
quic-mux = { git = "https://github.com/costinm/ssh-mesh", features = ["tokio"] }
quic-tools = { git = "https://github.com/costinm/ssh-mesh", features = ["tokio"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util", "process"] }
berry-c = { path = "../berry-c" }
wasm3-c = { path = "../wasm3-c" }
wat = "1"
mod-cel = { path = "../../modules/mod_cel" }
ucel = { path = "../uCEL", features = ["parser"] }
