[package]
name = "xip-runtime-host"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The xip runtime for a development host (Linux): loads modules as shared objects, runs them with the same event model as the device runtimes, virtual time and pluggable fixtures"
publish = false


[dependencies]
xip-abi = { path = "../xip-abi" }
xip-wasm = { path = "../xip-wasm" }
xip-psa = { path = "../xip-psa" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros", "net", "io-util", "sync", "signal"] }

[[bin]]
name = "xip-host"
path = "src/main.rs"

[dev-dependencies]
dmesh-cli = { path = "../dmesh-cli" }
tempfile = "3"
tokio = { version = "1", features = ["test-util", "process"] }
berry-c = { path = "../berry-c" }
wasm3-c = { path = "../wasm3-c" }
wat = "1"
