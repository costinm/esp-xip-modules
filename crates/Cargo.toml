# The host-buildable crates, one workspace and one Cargo.lock (stable toolchain, this machine's target):
#   cargo test --manifest-path crates/Cargo.toml --workspace
# Nothing that needs the ESP toolchain or esp-idf-sys unconditionally belongs here: firmware (partitions, startup, transport glue) is
# under fw/, the no_std modules under modules/ (each its own project with its own target); they depend on these crates by path.
[workspace]
members = ["xip-abi", "xip-runtime-esp", "xip-runtime-host", "dmesh-cli"]
resolver = "2"

# Local cross-repository protocol development; refresh Git pins after publication.
[patch."https://github.com/costinm/dmesh"]
dmesh-server = { path = "../../dmesh/crates/dmesh-server" }
quic-lite = { path = "../../dmesh/crates/quic-lite" }
uart-codec = { path = "../../dmesh/crates/uart-codec" }
dmesh-rawnan = { path = "../../dmesh/crates/rawnan" }
