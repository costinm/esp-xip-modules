[package]
name = "xip-psa"
version = "0.1.0"
edition = "2021"
description = "The runtime's cryptography in pure Rust (hash, HMAC, P-256 verify/ECDH, random, persisted device identity). Modules do not link it: they call the runtime's crypto and identity tables."

[dependencies]
sha2 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
rand_core = { version = "0.6", features = ["getrandom"] }
