[package]
name = "dmesh-cli"
version = "0.1.0"
edition = "2024"
publish = false

# Moved here from the DMesh repository on 2026-10-20:
# the tool is mainly for interacting with devices. DMesh libraries are consumed at a pinned revision; DMesh never depends on this repository.
[features]
default = []

[dependencies]
anyhow = "1.0"
dmesh-rawnan = { git = "https://github.com/costinm/dmesh", rev = "0b3e629444b072d65799baab73a8868c476498b0" }
dmesh-server = { git = "https://github.com/costinm/dmesh", rev = "0b3e629444b072d65799baab73a8868c476498b0", default-features = false, features = ["std"] }
glob = "0.3"
quic-lite = { git = "https://github.com/costinm/dmesh", rev = "0b3e629444b072d65799baab73a8868c476498b0", features = ["tokio"] }
libc = "0.2"
minicbor = "2.2"
sha2 = "0.11"
toml = "0.8"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
uart-codec = { git = "https://github.com/costinm/dmesh", rev = "0b3e629444b072d65799baab73a8868c476498b0", features = ["host"] }
mesh = { git = "https://github.com/costinm/ssh-mesh", package = "mesh" }
serde_json = "1.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["time"] }
tempfile = "3"
