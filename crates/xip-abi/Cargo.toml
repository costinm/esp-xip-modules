[package]
name = "xip-abi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust mirror of the esp-xip-modules host table (generated) and a safe wrapper for module code"
publish = false

[features]
# `alloc` for modules over the host heap (src/heap.rs): an explicit Allocator value (nightly), and/or the global allocator.
allocator-api = []
global-alloc = []
# Standard RustCrypto trait adapters backed by the native PSA table.
rustcrypto = ["dep:digest", "dep:p256"]


[dependencies]
digest = { version = "0.10", default-features = false, optional = true }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa-core"], optional = true }
