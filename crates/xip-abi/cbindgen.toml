# `scripts/gen.sh` runs this over src/host.rs to write include/xip.h.
language = "C"
header = "/* GENERATED by scripts/gen.sh (cbindgen) from crates/xip-abi/src/host.rs. Do not edit. */"
pragma_once = true
documentation_style = "c99"
cpp_compat = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
style = "type"

usize_is_size_t = true

trailer = """
_Static_assert(sizeof(xip_relay_hop) == 64, "xip_relay_hop layout");
_Static_assert(sizeof(xip_relay_route) == 280, "xip_relay_route layout");
_Static_assert(sizeof(xip_relay_stats) == 16, "xip_relay_stats layout");
_Static_assert(sizeof(xip_spi_config) == 44, "xip_spi_config layout");
_Static_assert(sizeof(xip_dmod_header) == 64, "xip_dmod_header layout");
_Static_assert(sizeof(xip_wifi_intent) == 216, "xip_wifi_intent layout");
_Static_assert(sizeof(xip_wifi_state) == 68, "xip_wifi_state layout");
_Static_assert(sizeof(xip_wifi_tuning) == 24, "xip_wifi_tuning layout");
_Static_assert(sizeof(xip_link_info) == 60, "xip_link_info layout");
_Static_assert(sizeof(xip_wifi_monitor) == 8, "xip_wifi_monitor layout");
_Static_assert(sizeof(xip_wifi_ap) == 42, "xip_wifi_ap layout");
_Static_assert(sizeof(xip_power_sleep) == 12, "xip_power_sleep layout");
_Static_assert(sizeof(xip_power_info) == 76, "xip_power_info layout");
_Static_assert(sizeof(xip_ble_start) == 8, "xip_ble_start layout");
_Static_assert(sizeof(xip_ble_scan) == 8, "xip_ble_scan layout");
_Static_assert(sizeof(xip_ble_connect) == 16, "xip_ble_connect layout");
_Static_assert(sizeof(xip_system_heap_info) == 24, "xip_system_heap_info layout");
_Static_assert(sizeof(xip_system_heap_dump) == 4, "xip_system_heap_dump layout");
_Static_assert(sizeof(xip_ble_listen) == 8, "xip_ble_listen layout");
_Static_assert(sizeof(xip_ble_mode) == 8, "xip_ble_mode layout");
_Static_assert(sizeof(xip_ble_status) == 92, "xip_ble_status layout");
_Static_assert(sizeof(xip_ble_scan_results) == 152, "xip_ble_scan_results layout");
_Static_assert(sizeof(xip_nimble_filter) == 20, "xip_nimble_filter layout");
_Static_assert(sizeof(xip_nimble_start) == 96, "xip_nimble_start layout");
_Static_assert(sizeof(xip_nimble_scan) == 68, "xip_nimble_scan layout");
_Static_assert(sizeof(xip_nimble_connect) == 20, "xip_nimble_connect layout");
#if UINTPTR_MAX == 0xffffffffu
_Static_assert(sizeof(xip_system) == 20, "xip_system layout");
_Static_assert(sizeof(xip_stream) == 36, "xip_stream layout");
_Static_assert(sizeof(xip_quic) == 44, "xip_quic layout");
_Static_assert(sizeof(xip_stream_packet) == 12, "xip_stream_packet layout");
_Static_assert(sizeof(xip_call) == 88, "xip_call layout");
_Static_assert(sizeof(xip_identity) == 20, "xip_identity layout");
_Static_assert(sizeof(xip_power) == 44, "xip_power layout");
_Static_assert(sizeof(xip_host) == 172, "xip_host layout");
#endif

/* Non-zero when the host's table includes this call (older hosts are shorter). */
#define XIP_HOST_HAS(host, call) \\
    ((host)->size >= offsetof(xip_host, call) + sizeof((host)->call))

/* The one symbol a module exports; the host calls it for every event. `state` is the module's zeroed
 * state block. Return XIP_RET_CONTINUE, XIP_RET_DONE or a negative error. */
typedef int (*xip_handle_fn)(const xip_host *host, void *state, const xip_call *call);
#ifdef __cplusplus
extern "C"
#endif
int xip_handle(const xip_host *host, void *state, const xip_call *call);
"""

[export]
include = ["System", "SystemHeapInfo", "SystemHeapDump", "Lora", "Nan", "NanTransport", "Serial", "Stream", "StreamPacket", "Quic", "RelayHop", "RelayRoute", "RelayStats", "PacketPoolInfo", "Identity", "SerialRxBuffer", "SerialPacketTx", "SerialPacketClient", "Host", "Call", "SpiConfig", "DmodHeader", "WifiIntent", "WifiState", "Wifi", "WifiTuning", "WifiTuner", "Link", "LinkInfo", "WifiMonitor", "WifiAp", "Power", "PowerSleep", "PowerInfo", "Hardware", "Ble", "BleStart", "BleScan", "BleConnect", "BleListen", "BleMode", "BleStatus", "BleScanResults", "Nimble", "NimbleFilter", "NimbleStart", "NimbleScan", "NimbleConnect"]
